name: Update Kindle sale site

on:
  # 定期実行は GitHub の schedule をやめ、Google Cloud Scheduler から
  # workflow_dispatch API を叩く方式に移行した (2026-08-29)。
  #
  # 理由: GitHub の schedule は高負荷時に発火そのものをスキップする。
  # 2026-08-22〜29 の実測で、公称「毎時」に対し中央値は59分と近いものの
  # 最長13.1時間の欠測があり、3サイト(家電/電書/林檎ポチ)で同時刻に
  # 同じ穴が空いていた。ワークフロー自体の失敗はほぼ0件で、GitHub側の
  # 間引きが原因と確定している。workflow_dispatch はこの間引きの対象外。
  #
  # 発火元: Cloud Scheduler ジョブ densho-pochi-update
  #         (GCPプロジェクト manga-rss / asia-northeast1 / cron "37 */2 * * *" UTC)
  #
  # **間隔を変えたら config.json の文言も必ず直すこと。**
  # サイトのヘッダーと「〜について」セクションに更新頻度を書いており
  # （config.json の site_description と about）、cronだけ変えると表示が
  # 嘘になる。実際2026-08時点で、3サイトとも「1時間ごと」と表示しながら
  # 実態は家電2時間・電書6時間・林檎30分とすべて食い違っていた。
  # 毎時ではなく2時間間隔にしているのは、Creators API の上限8,640req/日を
  # 家電ポチ(Partner Tag は natafull-22 で共通)と共有しているため。
  # 本ワークフローは実測で約175req/回(企画スキャン30件×最大5ページ＋
  # ジャンル検索4×5)なので 12回/日 = 2,100req。家電ポチ(毎時・170req/回で
  # 24回/日 = 4,080req)と合算して 6,180req/日、上限の71.5%。
  # 両方を毎時にすると8,280req(96%)になり、手動実行が1回混ざるだけで
  # 超えるため、ここを2時間より短くしないこと。
  # ※ schedule を消したので、間隔を変えたいときはこのファイルではなく
  #   Cloud Scheduler 側のジョブを直すこと。
  #
  # 人手でconfig.jsonやスクリプトを変えたとき、次の定時実行(最大2時間後)を
  # 待たずに公開されるようにする。docsはアーティファクトで配信しており
  # コミットしていないため、pushトリガーを付けても本ワークフロー自身の
  # コミット(data/campaign_state.jsonのみ)では発火せずループしない
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write  # campaign_state.json(企画の掲載開始日)のコミットに必要
  pages: write
  id-token: write

concurrency:
  group: pages
  # 走行中の実行を打ち切らない。config.jsonやスクリプトを直してpushすると、
  # 定期実行の途中でも巻き込んでキャンセルしてしまい、消費済みのAPI
  # (175req)が丸ごと無駄になるうえ、通知だけ飛んでデプロイされない状態も
  # 起こりうる。実行6分に対し間隔は2時間なので、待たせても支障がない
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # サプライチェーン対策: アクションはタグでなくコミットSHAで固定する
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Fetch sale data from Creators API
        env:
          CREATORSAPI_CREDENTIAL_ID: ${{ secrets.CREATORSAPI_CREDENTIAL_ID }}
          CREATORSAPI_CREDENTIAL_SECRET: ${{ secrets.CREATORSAPI_CREDENTIAL_SECRET }}
          CREATORSAPI_PARTNER_TAG: ${{ secrets.CREATORSAPI_PARTNER_TAG }}
        run: python scripts/fetch_sales.py

      - name: Generate site
        run: python scripts/generate_site.py

      # 企画の掲載開始日を毎時実行をまたいで永続化する。
      # pushトリガーは設定していないのでループはしない
      - name: Persist campaign state
        run: |
          set -euo pipefail
          git add data/campaign_state.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "企画の掲載開始日を更新 [bot]"
            # 再生成されたsales.json/docsが未ステージで残っていても
            # rebaseできるようautostashを使う
            git pull --rebase --autostash origin main
            # マーカーが混入したまま公開されると全企画の掲載開始日が
            # 失われるため、push前に必ず確認する(林檎ポチと同じ防御)
            if git grep -qE '^(<<<<<<<|>>>>>>>)' -- data/; then
              echo "::error::コンフリクトマーカーを検出したため中止します"
              exit 1
            fi
            git push
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      # 新着企画の通知はデプロイが終わってから送る。fetch_sales.py の中で
      # 送っていた頃は、生成・コミット・デプロイのどれかが失敗すると
      # 「通知は届いたのにサイトは前回のまま」になっていた。
      # 前のステップが失敗すればこのステップは実行されない(=通知も飛ばない)
      - name: Notify new campaigns
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/notify.py

      # 取得に失敗するとサイトは前回の内容のまま据え置かれる。1回なら実害は
      # ないが、止まったことに気づけないと古い内容が何時間も放置される。
      # Cloud SchedulerのPAT期限切れのように3サイトが同時に静かに止まる事故も
      # あるため、失敗したときだけ鳴らす。必ず最後のステップに置くこと
      # (前のどのステップが落ちても拾えるようにするため)
      - name: Notify on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/notify.py --failure
