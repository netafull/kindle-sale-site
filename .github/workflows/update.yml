name: Update Kindle sale site

on:
  # 定期実行は GitHub の schedule をやめ、Google Cloud Scheduler から
  # workflow_dispatch API を叩く方式に移行した (2026-08-29)。
  #
  # 理由: GitHub の schedule は高負荷時に発火そのものをスキップする。
  # 2026-08-22〜29 の実測で、公称「毎時」に対し中央値は59分と近いものの
  # 最長13.1時間の欠測があり、3サイト(家電/電書/林檎ポチ)で同時刻に
  # 同じ穴が空いていた。ワークフロー自体の失敗はほぼ0件で、GitHub側の
  # 間引きが原因と確定している。workflow_dispatch はこの間引きの対象外。
  #
  # 発火元: Cloud Scheduler ジョブ densho-pochi-update
  #         (GCPプロジェクト manga-rss / asia-northeast1 / cron "37 */6 * * *" UTC)
  # 毎時から6時間間隔に落としたのは、掲載元のセール企画の入れ替わりが
  # そもそも遅く毎時取得の必要が薄いことと、Creators API の上限8,640req/日を
  # 家電ポチ(Partner Tag は natafull-22 で共通)と共有しているため。
  # 2サイト合算で約3,000req/日、上限の35%に収まる。
  # ※ schedule を消したので、間隔を変えたいときはこのファイルではなく
  #   Cloud Scheduler 側のジョブを直すこと。
  #
  # 人手でconfig.jsonやスクリプトを変えたとき、次の定時実行(最大6時間後)を
  # 待たずに公開されるようにする。docsはアーティファクトで配信しており
  # コミットしていないため、pushトリガーを付けても本ワークフロー自身の
  # コミット(data/campaign_state.jsonのみ)では発火せずループしない
  push:
    branches: [main]
    paths-ignore:
      - "data/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write  # campaign_state.json(企画の掲載開始日)のコミットに必要
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # サプライチェーン対策: アクションはタグでなくコミットSHAで固定する
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"

      - name: Fetch sale data from Creators API
        env:
          CREATORSAPI_CREDENTIAL_ID: ${{ secrets.CREATORSAPI_CREDENTIAL_ID }}
          CREATORSAPI_CREDENTIAL_SECRET: ${{ secrets.CREATORSAPI_CREDENTIAL_SECRET }}
          CREATORSAPI_PARTNER_TAG: ${{ secrets.CREATORSAPI_PARTNER_TAG }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python scripts/fetch_sales.py

      - name: Generate site
        run: python scripts/generate_site.py

      # 企画の掲載開始日を毎時実行をまたいで永続化する。
      # pushトリガーは設定していないのでループはしない
      - name: Persist campaign state
        run: |
          set -euo pipefail
          git add data/campaign_state.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -m "企画の掲載開始日を更新 [bot]"
            # 再生成されたsales.json/docsが未ステージで残っていても
            # rebaseできるようautostashを使う
            git pull --rebase --autostash origin main
            # マーカーが混入したまま公開されると全企画の掲載開始日が
            # 失われるため、push前に必ず確認する(林檎ポチと同じ防御)
            if git grep -qE '^(<<<<<<<|>>>>>>>)' -- data/; then
              echo "::error::コンフリクトマーカーを検出したため中止します"
              exit 1
            fi
            git push
          fi

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
